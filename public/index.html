<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevMetrics — GitHub Analytics</title>
  <style>
    :root { --fundo:#0f1318; --carta:#1a2027; --borda:#2c3540; --texto:#e8edf2; --suave:#8b98a5; --azul:#388bfd; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:"Segoe UI",system-ui,Arial,sans-serif; background:var(--fundo); color:var(--texto); padding:20px; }
    h1 { font-size:20px; } .sub { color:var(--suave); font-size:13px; margin-bottom:16px; }
    .linha { display:flex; gap:10px; margin-bottom:18px; }
    .linha input { background:var(--carta); border:1px solid var(--borda); color:var(--texto); border-radius:8px; padding:10px 14px; font-size:14px; width:240px; }
    .linha button { background:var(--azul); border:none; color:#fff; font-weight:700; border-radius:8px; padding:10px 18px; cursor:pointer; }
    .metricas { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
    .m { background:var(--carta); border:1px solid var(--borda); border-radius:10px; padding:12px 18px; }
    .m b { font-size:22px; display:block; } .m span { color:var(--suave); font-size:12px; }
    .charts { display:flex; gap:20px; flex-wrap:wrap; }
    .cartao { background:var(--carta); border:1px solid var(--borda); border-radius:12px; padding:16px; }
    .cartao h2 { font-size:14px; color:var(--azul); margin-bottom:10px; }
    .barra { fill:var(--azul); } .rotulo { fill:var(--suave); font-size:11px; } .rotulo-valor { fill:var(--texto); font-size:12px; font-weight:700; }
    table { border-collapse:collapse; font-size:13px; }
    th, td { border:1px solid var(--borda); padding:6px 12px; text-align:left; }
    th { color:var(--suave); }
    a { color:var(--azul); }
  </style>
</head>
<body>
  <h1>📊 DevMetrics</h1>
  <p class="sub">analytics do GitHub — API própria + charts SVG puro + badges dinâmicos</p>
  <div class="linha">
    <input id="dono" value="FrancosCorporation" placeholder="usuário GitHub">
    <button onclick="carregar()">Analisar</button>
  </div>
  <div class="metricas" id="metricas" hidden></div>
  <div class="charts" id="charts" hidden>
    <div class="cartao"><h2>Repos por linguagem</h2><div id="chart-lang"></div></div>
    <div class="cartao"><h2>Top por stars</h2><table id="top"></table></div>
  </div>
  <div class="cartao" id="badges" hidden style="margin-top:16px">
    <h2>Badges dinâmicos (pra colar no README)</h2>
    <div id="badge-lista" style="display:flex;gap:10px;align-items:center"></div>
  </div>
  <script>
    async function carregar() {
      const dono = document.getElementById('dono').value.trim();
      if (!dono) return;
      const resumo = await fetch(`/api/${dono}/resumo`).then((r) => r.json());
      const metricasEl = document.getElementById('metricas');
      metricasEl.hidden = false;
      metricasEl.innerHTML = `
        <div class="m"><b>${resumo.totalRepos}</b><span>repos</span></div>
        <div class="m"><b>${resumo.publicos}</b><span>públicos</span></div>
        <div class="m"><b>${resumo.stars}</b><span>stars</span></div>
        <div class="m"><b>${resumo.forks}</b><span>forks</span></div>`;
      const linguagens = await fetch(`/api/${dono}/linguagens`).then((r) => r.json());
      document.getElementById('chart-lang').innerHTML = linguagens.slice(0, 8)
        .map((l) => ({ rotuloCampo: 'linguagem', valorCampo: 'quantidade', ...l }))
        .map((l) => l).length ? svgBarras(linguagens.slice(0, 8)) : '';
      const top = await fetch(`/api/${dono}/top?n=5`).then((r) => r.json());
      document.getElementById('top').innerHTML = '<tr><th>Repo</th><th>⭐</th><th>🍴</th></tr>' +
        top.map((r) => `<tr><td><a href="${r.url}">${r.nome}</a></td><td>${r.stars}</td><td>${r.forks}</td></tr>`).join('');
      const badgesEl = document.getElementById('badges');
      badgesEl.hidden = false;
      document.getElementById('badge-lista').innerHTML =
        `<img src="/badge/${dono}/repos"><img src="/badge/${dono}/stars">`;
    }
    function svgBarras(dados) {
      const max = Math.max(...dados.map((d) => d.quantidade), 1);
      const n = dados.length, largura = Math.max(320, n * 90), altura = 240, margemB = 70;
      const areaH = altura - margemB - 16, passo = largura / n;
      return `<svg viewBox="0 0 ${largura} ${altura}" width="${largura}" height="${altura}">` +
        dados.map((d, i) => {
          const h = (d.quantidade / max) * areaH;
          const x = 40 + i * passo + 8, y = altura - margemB - h;
          const nome = d.linguagem.length > 14 ? d.linguagem.slice(0, 13) + '…' : d.linguagem;
          return `<rect class="barra" x="${x}" y="${y}" width="${passo - 16}" height="${h}" rx="4"><title>${d.linguagem}: ${d.quantidade}</title></rect>
            <text class="rotulo-valor" x="${x + (passo - 16) / 2}" y="${y - 6}" text-anchor="middle">${d.quantidade}</text>
            <text class="rotulo" x="${x + (passo - 16) / 2}" y="${altura - margemB + 16}" text-anchor="middle" transform="rotate(35 ${x + (passo - 16) / 2} ${altura - margemB + 16})">${nome}</text>`;
        }).join('') + '</svg>';
    }
  </script>
</body>
</html>
